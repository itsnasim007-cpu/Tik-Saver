<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tik Saver - By Nasim</title>
<style>
body{background:#120d26;color:#fff;font-family:sans-serif;padding:16px;margin:0}
.card{background:#1e1535;border-radius:16px;padding:16px;max-width:500px;margin:20px auto;border:1px solid #2d2250}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#0f0a1f;color:#fff;box-sizing:border-box}
.btn{width:100%;padding:14px;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:10px}
video{width:100%;border-radius:12px;margin-top:12px;background:#000}
.dl{display:block;background:#7c3aed;color:#fff;text-align:center;padding:12px;border-radius:10px;text-decoration:none;margin-top:10px;font-weight:700}
</style>
</head>
<body>
<div style="text-align:center;padding:20px">
<h2>Tik Saver</h2>
<p>Made by MD M Nasim</p>
</div>

<div class="card">
<input id="url" placeholder="TikTok link paste korun...">
<button class="btn" onclick="getVideo()">SEARCH</button>
<div id="err" style="color:#f55;margin-top:10px;display:none"></div>
<video id="v" controls style="display:none"></video>
<a id="d" class="dl" style="display:none" target="_blank">Download - Gallery Save</a>
<p id="msg" style="display:none;color:#0f0;text-align:center;margin-top:10px">Saved! Gallery > Videos e check korun</p>
</div>

<script>
async function getVideo(){
let u=document.getElementById('url').value.trim();
let e=document.getElementById('err');
e.style.display='none';
if(!u){e.textContent='Link din!';e.style.display='block';return}
try{
let r=await fetch('https://www.tikwm.com/api/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
let j=await r.json();
if(j.code!=0)throw new Error('Video pawa jayni');
let d=j.data;
let play=d.hdplay||d.play;
let vp=document.getElementById('v');
vp.src=play;vp.style.display='block';
let dl=document.getElementById('d');
dl.href=play;dl.download='tik-saver-'+Date.now()+'.mp4';dl.style.display='block';
dl.onclick=()=>{setTimeout(()=>{document.getElementById('msg').style.display='block'},500);window.open('https://asiafilm.org/4/0a5f0267676c397e134ebde5a808e1df','_blank')}
}catch(err){e.textContent=err.message;e.style.display='block'}
}
</script>
</body>
</html>
